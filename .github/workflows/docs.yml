name: Deploy Landing + Docs to GitHub Pages
on:
  push:
    branches:
      - main
    paths:
      - 'docsite/**'
      - 'landing/**'
      - 'branding/**'
      - 'icon.png'
      - 'README.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'indieshade/uiflow'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docsite/requirements.txt

      - name: Build landing + docs
        run: |
          mkdir -p _site
          cp -R landing/. _site/
          # Paths in mkdocs.yml are relative to the config file directory, so use an
          # absolute site-dir; otherwise docs land in docsite/_site and never get uploaded.
          mkdocs build --config-file docsite/mkdocs.yml --site-dir "$GITHUB_WORKSPACE/_site/docs"
          test -f _site/index.html
          test -f _site/docs/index.html
          ls -la _site _site/docs | head -n 40

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.repository == 'indieshade/uiflow'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
