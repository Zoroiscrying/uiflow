site_name: UIFlow Docs
site_url: https://zoroiscrying.github.io/uiflow/
site_author: UIFlow
site_description: UIFlow - Godot 4 UI workflow framework documentation

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search:
      lang: en
  - i18n:
      default_language: en
      languages:
        - locale: en
          name: English
          default: true
        - locale: zh
          name: 中文

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zoroiscrying/uiflow
  version:
    provider: mike

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - First Page: getting-started/first-page.md
      - Navigation: getting-started/navigation.md
  - Features:
      - Transitions: features/transitions.md
      - Data Binding: features/data-binding.md
      - Event Bus: features/event-bus.md
      - Components: features/components.md
      - Timeline & Async: features/timeline-async.md
  - Examples:
      - Demo Hub: examples/demo-hub.md
      - 3D World Demo: examples/3d-world-demo.md
  - API Reference: api/index.md
