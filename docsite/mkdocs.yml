site_name: UIFlow Docs
site_url: https://indieshade.github.io/uiflow/docs/
site_author: IndieShade
site_description: UIFlow — Godot 4 UI workflow framework documentation

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/icon.png
  favicon: assets/icon.png
  font:
    text: Sora
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to paper light
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/white-balance-sunny
        name: Switch to navy dark
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

extra_css:
  - stylesheets/uiflow.css

plugins:
  - search:
      lang: en
  - i18n:
      languages:
        - locale: en
          name: English
          default: true
        - locale: zh
          name: 中文
          nav_translations:
            Product: 产品页
            Home: 首页
            Getting Started: 快速开始
            Installation: 安装与配置
            First Page: 第一个页面
            Navigation: 导航与传参
            Features: 核心功能
            Transitions: 页面过渡
            Data Binding: 数据绑定
            Event Bus: 事件总线
            Components: 内置组件
            Timeline & Async: Timeline 与 Async
            Gamepad UI: 手柄 UI
            Examples: 示例
            Demo Hub: Demo Hub
            3D World Demo: 3D 世界示例
            API Reference: API 参考
            Pro (Paid): Pro（付费）
            Pro Overview: Pro 概览
            Pro Components: Pro 组件
            Editor Tools: 编辑器工具
            Runtime Debugger: 运行时调试器
            Survivors Demo: Survivors 演示

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  homepage: https://indieshade.github.io/uiflow/
  product_url: https://indieshade.github.io/uiflow/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/indieshade/uiflow
  generator: false

copyright: UIFlow by <a href="https://github.com/indieshade">IndieShade</a> · MIT

nav:
  - Product: https://indieshade.github.io/uiflow/
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - First Page: getting-started/first-page.md
      - Navigation: getting-started/navigation.md
  - Features:
      - Transitions: features/transitions.md
      - Data Binding: features/data-binding.md
      - Event Bus: features/event-bus.md
      - Components: features/components.md
      - Timeline & Async: features/timeline-async.md
      - Gamepad UI: features/gamepad-ui.md
  - Examples:
      - Demo Hub: examples/demo-hub.md
      - 3D World Demo: examples/3d-world-demo.md
  - API Reference: api/index.md
  - Pro (Paid):
      - Pro Overview: pro/index.md
      - Pro Components: pro/components.md
      - Editor Tools: pro/editor-tools.md
      - Runtime Debugger: pro/debugger.md
      - Examples:
          - Survivors Demo: pro/examples/survivors.md
